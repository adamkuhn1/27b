<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Private phase: keep every surface out of search indexes until launch. -->
    <meta name="robots" content="noindex,nofollow" />
    <!--
      Both files, because the two paths a browser can take are different: with
      a declared icon it fetches this one and never asks for /favicon.ico, and
      without one it asks for /favicon.ico regardless — which is where the 404
      on every load came from. The .ico is the same mark rasterised at 16 and
      32 px; both are generated by scripts/make-favicon.mjs.
    -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="./favicon.ico" />
    <title>27B</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
